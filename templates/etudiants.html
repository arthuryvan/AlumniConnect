<!DOCTYPE html>
<html>
<head>
    <title>Étudiants</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/etudiants.css') }}">
</head>
<body>

<h1>🎓 Étudiants</h1>

{% for etudiant in etudiants %}

<div class="etudiant-card">

    <h3>{{ etudiant.nom }}</h3>

    <p>Email : {{ etudiant.email }}</p>

    <p>Filière : {{ etudiant.filiere }}</p>

    <p>Promotion : {{ etudiant.promotion }}</p>

    <a href="{{ url_for('recommander', student_id=etudiant.id) }}"
   class="btn-recommander">
    ⭐ Recommander
    </a>

</div>

{% endfor %}

</body>
</html>
