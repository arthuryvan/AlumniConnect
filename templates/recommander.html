<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recommander un étudiant - AlumniConnect</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .student {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .retour {
            display: inline-block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⭐ Recommander un étudiant</h1>

    <div class="student">
        <h2>{{ etudiant.nom }}</h2>

        <p>
            <strong>Filière :</strong>
            {{ etudiant.filiere }}
        </p>

        <p>
            <strong>Promotion :</strong>
            {{ etudiant.promotion }}
        </p>
    </div>

    <form method="POST">

        <label for="message">
            Votre recommandation :
        </label>

        <br><br>

        <textarea
            name="message"
            id="message"
            placeholder="Écrivez pourquoi vous recommandez cet étudiant..."
            required></textarea>

        <br>

        <button type="submit">
            Envoyer la recommandation
        </button>

    </form>

    <a href="{{ url_for('etudiants') }}" class="retour">
        ← Retour aux étudiants
    </a>

</div>

</body>
</html>
