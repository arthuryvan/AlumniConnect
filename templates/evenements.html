{% extends "base.html" %}

{% block content %}

<h2>Evenements</h2>

<a href="{{ url_for('creer_evenement') }}">
    creer un evenement
</a>

{% for event in events %}

<div>
    <h3>{{ event.titre }}</h3>
    <p>{{event.description }}</p>
    <p>{{event.lieu }}</p>
    <p>{{ event.date_event }}</p>
</div>

{% endfor %}

{% endblock %}
